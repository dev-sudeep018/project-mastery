name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce. Do not post credentials or sensitive code.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: textarea
    id: evidence
    attributes:
      label: Error text or relevant test result
